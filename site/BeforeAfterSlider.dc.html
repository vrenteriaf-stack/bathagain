<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{containerRef}}" onMouseDown="{{onMouseDown}}" onTouchStart="{{onTouchStart}}" style="position:relative;width:100%;height:100%;overflow:hidden;cursor:ew-resize;user-select:none;touch-action:none;background:#0a2d56;">
  <img src="{{afterSrc}}" alt="{{afterAlt}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;" />
  <span style="position:absolute;top:14px;right:14px;background:#c9a15a;color:#0a2d56;font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;padding:8px 14px;font-weight:700;z-index:2;">AFTER</span>
  <div style="position:absolute;inset:0;overflow:hidden;clip-path:inset(0 {{ clipRight }}% 0 0);">
    <img src="{{beforeSrc}}" alt="{{beforeAlt}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;" />
    <span style="position:absolute;top:14px;left:14px;background:#0a2d56;color:#fff;font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;padding:8px 14px;z-index:2;">BEFORE</span>
  </div>
  <div style="position:absolute;top:0;bottom:0;width:3px;background:#ffffff;left:{{ handleLeft }};transform:translateX(-50%);z-index:3;box-shadow:0 0 10px rgba(0,0,0,0.45);pointer-events:none;">
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,0.35);">
      <span style="color:#0a2d56;font-size:18px;line-height:1;">&#8596;</span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 500, &quot;height&quot;: 400}, &quot;before&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;assets/before-1.jpg&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;after&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;assets/after-1.jpg&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;beforeAlt&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Before&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;afterAlt&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;After&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = { percent: 50, dragging: false };
  containerRef = React.createRef();
  rafId = null;
  pendingX = null;

  applyClientX = (clientX) => {
    const el = this.containerRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    let pct = ((clientX - rect.left) / rect.width) * 100;
    pct = Math.max(0, Math.min(100, pct));
    this.setState({ percent: pct });
  };

  handleMove = (e) => {
    if (!this.state.dragging) return;
    if (e.touches && e.touches.length) {
      e.preventDefault();
      this.applyClientX(e.touches[0].clientX);
    } else if (typeof e.clientX === 'number') {
      this.applyClientX(e.clientX);
    }
  };

  handleUp = () => {
    this.setState({ dragging: false });
    window.removeEventListener('mousemove', this.handleMove);
    window.removeEventListener('mouseup', this.handleUp);
    window.removeEventListener('touchmove', this.handleMove);
    window.removeEventListener('touchend', this.handleUp);
  };

  onMouseDown = (e) => {
    e.preventDefault();
    this.setState({ dragging: true });
    this.applyClientX(e.clientX);
    window.addEventListener('mousemove', this.handleMove);
    window.addEventListener('mouseup', this.handleUp);
  };

  onTouchStart = (e) => {
    this.setState({ dragging: true });
    this.applyClientX(e.touches[0].clientX);
    window.addEventListener('touchmove', this.handleMove, { passive: false });
    window.addEventListener('touchend', this.handleUp);
  };

  componentWillUnmount() {
    window.removeEventListener('mousemove', this.handleMove);
    window.removeEventListener('mouseup', this.handleUp);
    window.removeEventListener('touchmove', this.handleMove);
    window.removeEventListener('touchend', this.handleUp);
  }

  renderVals() {
    const percent = this.state.percent;
    return {
      containerRef: this.containerRef,
      onMouseDown: this.onMouseDown,
      onTouchStart: this.onTouchStart,
      clipRight: (100 - percent).toFixed(2),
      handleLeft: percent.toFixed(2) + '%',
      beforeSrc: this.props.before,
      afterSrc: this.props.after,
      beforeAlt: this.props.beforeAlt ?? 'Before',
      afterAlt: this.props.afterAlt ?? 'After'
    };
  }
}

</script>
</body>
</html>
